<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>Visa Document Checklist Generator | AustralianTranslationServices</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #fff; font-family: 'Open Sans', sans-serif; }
      .demo-hero { background: linear-gradient(135deg, #144924, #0d6b45); color: #fff; text-align: center; padding: 56px 16px 64px; }
      .demo-hero h1 { font-family: Poppins, sans-serif; font-size: clamp(28px, 4vw, 44px); margin: 0 0 12px; }

      .demo-wrap { max-width: 1180px; margin: -32px auto 64px; padding: 0 16px; }

  <body>
    <!-- Demo page only. In WordPress the hero comes from the page builder;
         the plugin just outputs the mount <div> below. -->
    <header class="demo-hero">
      <h1>Visa Document Checklist Generator</h1>
      <p>Pick your destination, nationality and visa type to get a personalised document checklist, then tick documents off as you collect them and watch your readiness score grow.</p>
    </header>
    <main class="demo-wrap">
      <div class="ats-visa-checklist"
           data-quote-url="https://australiantranslationservices.com.au/"
           data-brand="AustralianTranslationServices"></div>
    </main>
    <script type="module" src="/src/main.jsx"></script>
